name: Go turn budget bypass gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/budget-bypass-gate.yml
      - package.json
      - pnpm-lock.yaml
      - src/budget/**
      - src/tools/go/**
      - src/runtime/go-capability-guard.ts
      - tests/budget/**
      - tests/rules/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-bypass:
    name: Spec §39.4 budget bypass attempts deterministically hit their limits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
          cache: ''

      - name: Install pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          test "$(node --version)" = "v24.11.1"
          test "$(pnpm --version)" = "11.7.0"

      - name: Fresh install
        run: pnpm install --frozen-lockfile

      - name: Run Spec §39.4 budget bypass suite
        run: pnpm exec vitest run tests/budget --reporter=verbose
