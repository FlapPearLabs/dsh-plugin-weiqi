name: Pinned DSH session ownership gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/session-ownership-gate.yml
      - package.json
      - pnpm-lock.yaml
      - src/**
      - tests/upgrade-gates/session-ownership/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    name: real AgentLoop materialization and lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Companion Go
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: dsh
          fetch-depth: 1

      - name: Set pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
          cache: ''

      - name: Install pinned pnpm and confirm pins
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          test "$(node --version)" = "v24.11.1"
          test "$(pnpm --version)" = "11.7.0"
          test "$(git -C dsh rev-parse HEAD)" = "b150a551b8d465e31e418e1b2eaf5e79bbb7d28e"

      - name: Install pinned Harness dependencies
        working-directory: dsh
        run: pnpm install --frozen-lockfile

      - name: Run real AgentLoop ownership gate
        env:
          DSH_PINNED_ROOT: ${{ github.workspace }}/dsh
          TRACE_LOG: ${{ runner.temp }}/session-ownership-trace.log
        run: bash tests/upgrade-gates/session-ownership/run-session-ownership.sh

      - name: Upload executed trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: session-ownership-gate-trace
          path: ${{ runner.temp }}/session-ownership-trace.log
          if-no-files-found: error
