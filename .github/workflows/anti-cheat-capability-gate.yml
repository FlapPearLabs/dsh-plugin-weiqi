name: Go lane anti-cheat capability gate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/anti-cheat-capability-gate.yml
      - package.json
      - pnpm-lock.yaml
      - src/preset/go-preset.ts
      - src/runtime/go-capability-guard.ts
      - tests/anti-cheat/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anti-cheat:
    name: Spec §39.3 forbidden capabilities fail at execution authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
          cache: ''

      - name: Install pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          test "$(node --version)" = "v24.11.1"
          test "$(pnpm --version)" = "11.7.0"

      - name: Fresh install
        run: pnpm install --frozen-lockfile

      - name: Run Spec §39.3 anti-cheat capability suite
        run: pnpm exec vitest run tests/anti-cheat --reporter=verbose
