name: Tenuki conformance gate

on:
  pull_request:
    branches:
      - main
    paths:
      - tests/upgrade-gates/tenuki-conformance/**
      - docs/validation/TENUKI_CONFORMANCE_VERIFIED.md
      - .github/workflows/tenuki-conformance-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: pinned tenuki area / komi 7.5 / positional-superko
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Companion Go probe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
          cache: ''

      - name: Install pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          test "$(node --version)" = "v24.11.1"
          test "$(pnpm --version)" = "11.7.0"

      - name: Fresh install
        run: pnpm install --frozen-lockfile

      - name: Run tenuki conformance probe
        env:
          TRACE_LOG: ${{ runner.temp }}/tenuki-conformance-trace.log
        run: bash tests/upgrade-gates/tenuki-conformance/run-tenuki-conformance.sh

      - name: Upload executed trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tenuki-conformance-trace
          path: ${{ runner.temp }}/tenuki-conformance-trace.log
          if-no-files-found: warn
