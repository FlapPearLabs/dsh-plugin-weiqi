name: DSH cooperative-yield upgrade gate

on:
  push:
    branches:
      - work/bootstrap-foundation-v1
    paths:
      - tests/upgrade-gates/cooperative-yield/**
      - .github/workflows/cooperative-yield-upgrade-gate.yml
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    name: pinned DSH real AgentLoop
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout plugin fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: dsh
          fetch-depth: 1

      - name: Set pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
          cache: ''

      - name: Install pinned pnpm and print pins
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          test "$(node --version)" = "v24.11.1"
          test "$(pnpm --version)" = "11.7.0"
          test "$(git -C dsh rev-parse HEAD)" = "b150a551b8d465e31e418e1b2eaf5e79bbb7d28e"
          node -e "const fs=require('node:fs'); for (const f of ['package.json','packages/core/agent/package.json','packages/core/agent-loop/package.json','packages/llm/llm/package.json']) { const p=JSON.parse(fs.readFileSync('dsh/'+f,'utf8')); if (p.version !== '0.1.1-rc.2') throw new Error(f+' version '+p.version); console.log(f+': '+p.name+'@'+p.version) }"

      - name: Fresh install of pinned Harness dependencies
        working-directory: dsh
        run: pnpm install --frozen-lockfile

      - name: Install external fixture into pinned source tree
        shell: bash
        run: cp tests/upgrade-gates/cooperative-yield/cooperative-yield.spec.ts dsh/packages/core/agent-loop/tests/cooperative-yield.upgrade-gate.spec.ts

      - name: Run all cooperative-yield experiments
        working-directory: dsh
        shell: bash
        run: pnpm exec vitest run --no-file-parallelism packages/core/agent-loop/tests/cooperative-yield.upgrade-gate.spec.ts 2>&1 | tee ../cooperative-yield-trace.log

      - name: Upload executed trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cooperative-yield-upgrade-gate-trace
          path: cooperative-yield-trace.log
          if-no-files-found: warn
