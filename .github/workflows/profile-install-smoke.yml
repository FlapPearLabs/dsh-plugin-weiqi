name: DSH profile-install smoke

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-install-smoke.yml
      - cordis.patch.yml
      - package.json
      - pnpm-lock.yaml
      - src/**
      - tests/profile-install/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/profile-install-smoke.yml
      - cordis.patch.yml
      - package.json
      - pnpm-lock.yaml
      - src/**
      - tests/profile-install/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-install:
    name: packed bundle, profile reconciliation, mount
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Companion Go Foundation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout pinned DeepSeek Harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: dsh
          fetch-depth: 1

      - name: Set pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
          cache: ''

      - name: Install pinned pnpm and confirm pins
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          test "$(node --version)" = "v24.11.1"
          test "$(pnpm --version)" = "11.7.0"
          test "$(git -C dsh rev-parse HEAD)" = "b150a551b8d465e31e418e1b2eaf5e79bbb7d28e"

      - name: Fresh install of Foundation dependencies
        run: pnpm install --frozen-lockfile

      - name: Fresh install of pinned Harness dependencies
        working-directory: dsh
        run: pnpm install --frozen-lockfile

      - name: Build pinned Harness host packages used by source CLI
        working-directory: dsh
        run: pnpm run build:lib:host

      - name: Run real profile-install and mount smoke
        shell: bash
        env:
          DSH_SOURCE_DIR: ${{ github.workspace }}/dsh
          PROFILE_SMOKE_ROOT: ${{ runner.temp }}/companion-go-profile-smoke
        run: bash tests/profile-install/run-profile-install-smoke.sh 2>&1 | tee profile-install-trace.log

      - name: Upload executed trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-profile-install-smoke-trace
          path: profile-install-trace.log
          if-no-files-found: error
